name: Temporary Passkey Restore Patch

on:
  push:
    paths:
      - scripts/apply_passkey_reload_restore.py
      - .github/workflows/temp-passkey-restore.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply patch
        run: python3 scripts/apply_passkey_reload_restore.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Functions tests
        working-directory: frontend
        run: npm run test:functions

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Check diff
        run: git diff --check

      - name: Commit validated patch
        run: |
          rm scripts/apply_passkey_reload_restore.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/circleWallet.ts frontend/src/App.tsx frontend/src/circleWallet.test.ts frontend/src/passkeyPersistence.test.ts scripts/apply_passkey_reload_restore.py
          git commit -m "fix: restore passkey wallet after reload"
          git push origin HEAD:main
